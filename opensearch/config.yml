_meta:
  type: "config"
  config_version: 2

config:
  dynamic:
    http:
      anonymous_auth_enabled: false

    authc:
      # Requests from the Java app arrive with:
      # Authorization: Bearer <Keycloak access token>
      #
      # OpenSearch only validates the already-issued access token. It does not
      # perform the interactive OIDC login, so JWT + JWKS is sufficient here.
      # The JWKS endpoint uses Docker's internal Keycloak service name, while
      # required_issuer must match the public issuer contained in the token.
      jwt_auth_domain:
        description: "Keycloak access tokens"
        http_enabled: true
        transport_enabled: false
        order: 0
        http_authenticator:
          type: jwt
          challenge: false
          config:
            signing_key: null
            jwks_uri: "http://keycloak:8080/realms/demo/protocol/openid-connect/certs"
            jwt_header: "Authorization"
            jwt_url_parameter: null
            subject_key: preferred_username
            roles_key: roles
            required_issuer: "http://keycloak.localhost:8080/realms/demo"
            required_audience: opensearch
        authentication_backend:
          type: noop

      # Kept for the one-shot init container and emergency/admin access.
      basic_internal_auth_domain:
        description: "Internal users for bootstrap/admin access"
        http_enabled: true
        transport_enabled: true
        order: 1
        http_authenticator:
          type: basic
          challenge: true
        authentication_backend:
          type: internal
